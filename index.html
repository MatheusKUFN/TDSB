<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tower Defense Sandbox — Protótipo FPS</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101820; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud { position: fixed; inset: 0; pointer-events: none; color: #f4f7fb; }
    .panel { position: absolute; top: 18px; left: 18px; padding: 14px 16px; border: 1px solid #ffffff25; border-radius: 12px; background: #0b111bcc; backdrop-filter: blur(8px); box-shadow: 0 8px 32px #0003; }
    .title { font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #7ce7c5; }
    #status { margin-top: 7px; font-size: 12px; color: #c5d0dc; }
    .controls { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); padding: 10px 14px; border-radius: 10px; background: #0b111bcc; border: 1px solid #ffffff20; font-size: 12px; color: #dce5ed; text-align: center; white-space: nowrap; }
    kbd { display: inline-block; min-width: 22px; margin: 0 2px; padding: 3px 5px; border: 1px solid #ffffff38; border-radius: 5px; background: #ffffff12; color: white; font: inherit; font-weight: 700; }
    #crosshair { position: absolute; top: 50%; left: 50%; width: 14px; height: 14px; transform: translate(-50%, -50%); opacity: .9; }
    #crosshair::before, #crosshair::after { content: ""; position: absolute; background: #fff; border-radius: 2px; box-shadow: 0 0 5px #0008; }
    #crosshair::before { left: 6px; top: 1px; width: 2px; height: 12px; }
    #crosshair::after { left: 1px; top: 6px; width: 12px; height: 2px; }
    #overlay { position: fixed; inset: 0; display: grid; place-items: center; background: linear-gradient(#0c1824a8, #071018b8); color: white; cursor: pointer; }
    #overlay.hidden { display: none; }
    .card { width: min(420px, calc(100vw - 36px)); padding: 30px; text-align: center; border: 1px solid #ffffff2b; border-radius: 18px; background: #101c28ed; box-shadow: 0 24px 90px #0006; }
    .eyebrow { color: #7ce7c5; font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 10px 0; font-size: clamp(26px, 6vw, 38px); letter-spacing: -.04em; }
    .card p { margin: 0 0 22px; color: #c5d0dc; line-height: 1.6; font-size: 14px; }
    button { pointer-events: auto; border: 0; border-radius: 9px; padding: 12px 20px; background: #7ce7c5; color: #092018; font-weight: 800; font-size: 14px; cursor: pointer; }
    button:hover { background: #a0f4da; }
    .tip { margin-top: 16px; font-size: 11px; color: #91a3b4; }
    @media (max-width: 520px) { .controls { white-space: normal; width: calc(100% - 24px); line-height: 2.1; } .panel { top: 12px; left: 12px; } }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="hud">
    <div class="panel">
      <div class="title">Tower Defense Sandbox</div>
      <div id="status">Pronto para jogar</div>
    </div>
    <div id="crosshair"></div>
    <div class="controls"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> mover &nbsp; <kbd>SHIFT</kbd> correr &nbsp; <kbd>ESPAÇO</kbd> pular &nbsp; Mouse olhar</div>
  </div>
  <div id="overlay">
    <div class="card">
      <div class="eyebrow">Protótipo 01 · FPS</div>
      <h1>Explore a arena.</h1>
      <p>Um pequeno mundo 3D para começar. Caminhe, corra, pule e olhe ao redor em primeira pessoa.</p>
      <button id="start">Jogar</button>
      <div class="tip">Clique para capturar o mouse · Esc para liberar</div>
    </div>
  </div>
  <script type="module">
    import * as THREE from 'three';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9ac6d5);
    scene.fog = new THREE.Fog(0x9ac6d5, 35, 115);

    const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 180);
    camera.rotation.order = 'YXZ';
    camera.position.set(0, 1.7, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xe5f6ff, 0x65715a, 2.0));
    const sun = new THREE.DirectionalLight(0xfff0d7, 2.4);
    sun.position.set(-18, 32, 12);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -45;
    sun.shadow.camera.right = 45;
    sun.shadow.camera.top = 45;
    sun.shadow.camera.bottom = -45;
    scene.add(sun);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(240, 240),
      new THREE.MeshStandardMaterial({ color: 0x657b61, roughness: 1 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const grid = new THREE.GridHelper(200, 100, 0xd0e2c3, 0x91a68b);
    grid.position.y = 0.012;
    grid.material.transparent = true;
    grid.material.opacity = 0.26;
    scene.add(grid);

    // Marcadores simples dão escala e ajudam a perceber o movimento.
    const markerMat = new THREE.MeshStandardMaterial({ color: 0xd2b887, roughness: 0.9 });
    const darkMat = new THREE.MeshStandardMaterial({ color: 0x435b54, roughness: 0.95 });
    for (let x = -40; x <= 40; x += 10) {
      for (let z = -40; z <= 40; z += 10) {
        if (x === 0 && z === 0) continue;
        const h = 0.45 + ((Math.abs(x * 7 + z * 3) % 5) * 0.18);
        const geo = new THREE.BoxGeometry(0.7, h, 0.7);
        const block = new THREE.Mesh(geo, (Math.abs(x + z) % 20 === 0) ? markerMat : darkMat);
        block.position.set(x, h / 2, z);
        block.castShadow = true;
        block.receiveShadow = true;
        scene.add(block);
      }
    }

    // Uma plataforma central destaca o ponto inicial sem bloquear o jogador.
    const pad = new THREE.Mesh(
      new THREE.RingGeometry(1.8, 2.05, 48),
      new THREE.MeshBasicMaterial({ color: 0x7ce7c5, side: THREE.DoubleSide })
    );
    pad.rotation.x = -Math.PI / 2;
    pad.position.set(0, 0.025, 0);
    scene.add(pad);

    const overlay = document.getElementById('overlay');
    const status = document.getElementById('status');
    const keys = new Set();
    let yaw = 0;
    let pitch = 0;
    let verticalVelocity = 0;
    let grounded = true;
    let lastTime = performance.now();

    const WALK_SPEED = 5.5;
    const RUN_SPEED = 9.2;
    const JUMP_SPEED = 7.2;
    const GRAVITY = 20;
    const PLAYER_HEIGHT = 1.7;

    function lockMouse() {
      renderer.domElement.requestPointerLock();
    }
    document.getElementById('start').addEventListener('click', lockMouse);
    overlay.addEventListener('click', (event) => {
      if (event.target === overlay) lockMouse();
    });
    document.addEventListener('pointerlockchange', () => {
      const active = document.pointerLockElement === renderer.domElement;
      overlay.classList.toggle('hidden', active);
      status.textContent = active ? 'Em jogo · mouse capturado' : 'Pausado · clique em Jogar';
    });
    document.addEventListener('mousemove', (event) => {
      if (document.pointerLockElement !== renderer.domElement) return;
      yaw -= event.movementX * 0.0022;
      pitch -= event.movementY * 0.0022;
      pitch = Math.max(-Math.PI / 2 + 0.02, Math.min(Math.PI / 2 - 0.02, pitch));
      camera.rotation.set(pitch, yaw, 0, 'YXZ');
    });
    document.addEventListener('keydown', (event) => {
      keys.add(event.code);
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.code)) event.preventDefault();
    });
    document.addEventListener('keyup', (event) => keys.delete(event.code));
    window.addEventListener('blur', () => keys.clear());

    function update(dt) {
      if (document.pointerLockElement !== renderer.domElement) return;

      const forwardInput = (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0) - (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0);
      const sideInput = (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0) - (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0);
      const inputLength = Math.hypot(forwardInput, sideInput);
      if (inputLength > 0) {
        const speed = (keys.has('ShiftLeft') || keys.has('ShiftRight')) ? RUN_SPEED : WALK_SPEED;
        const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
        const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
        const scale = speed * dt / inputLength;
        camera.position.addScaledVector(forward, forwardInput * scale);
        camera.position.addScaledVector(right, sideInput * scale);
      }

      if (keys.has('Space') && grounded) {
        verticalVelocity = JUMP_SPEED;
        grounded = false;
      }
      verticalVelocity -= GRAVITY * dt;
      camera.position.y += verticalVelocity * dt;
      if (camera.position.y <= PLAYER_HEIGHT) {
        camera.position.y = PLAYER_HEIGHT;
        verticalVelocity = 0;
        grounded = true;
      }

      // Limites amplos para manter o jogador dentro da arena.
      camera.position.x = THREE.MathUtils.clamp(camera.position.x, -95, 95);
      camera.position.z = THREE.MathUtils.clamp(camera.position.z, -95, 95);
    }

    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;
      update(dt);
      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
